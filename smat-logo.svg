<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer rounded square background -->
  <rect width="56" height="56" rx="14" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner glass sheen -->
  <rect x="1" y="1" width="54" height="26" rx="13" fill="url(#glow)"/>

  <!-- Medical cross — vertical bar -->
  <rect x="24" y="10" width="8" height="36" rx="4" fill="white" opacity="0.95"/>

  <!-- Medical cross — horizontal bar -->
  <rect x="10" y="24" width="36" height="8" rx="4" fill="white" opacity="0.95"/>

  <!-- ECG / heartbeat line across the horizontal bar -->
  <polyline
    points="10,28 16,28 18,22 20,34 22,28 24,28 32,28 34,22 36,34 38,28 46,28"
    stroke="#06B6D4" stroke-width="1.6" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Center accent dot -->
  <circle cx="28" cy="28" r="3.5" fill="url(#bg)" opacity="0.7"/>
  <circle cx="28" cy="28" r="2" fill="white" opacity="0.9"/>

  <!-- Top-right small medical pulse dot -->
  <circle cx="41" cy="15" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="41" cy="15" r="1.2" fill="#22D3EE" opacity="0.9"/>
</svg>
