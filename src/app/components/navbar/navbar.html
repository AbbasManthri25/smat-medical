<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-inner">
    <a routerLink="/" class="nav-logo">
      <img src="smat-logo.svg" class="logo-img" alt="SMAT Medical Logo">
      <div>
        <div class="logo-name">SMAT Medical</div>
        <div class="logo-tag">Medical &amp; Dental Solutions</div>
      </div>
    </a>

    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a></li>
      <li><a routerLink="/products" routerLinkActive="active">Products</a></li>
      <li><a routerLink="/" fragment="about">About</a></li>
      <li><a routerLink="/" fragment="brands">Brands</a></li>
      <li><a routerLink="/" fragment="contact">Contact</a></li>
      <li *ngIf="auth.isAdmin()"><a routerLink="/admin" routerLinkActive="active">Admin</a></li>
    </ul>

    <div class="nav-right">
      <!-- Cart -->
      <a routerLink="/cart" class="nav-cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" *ngIf="cart.count() > 0">{{ cart.count() }}</span>
      </a>

      <!-- Auth -->
      <ng-container *ngIf="!auth.isLoggedIn()">
        <a routerLink="/login" class="nav-login">Sign In</a>
      </ng-container>
      <ng-container *ngIf="auth.isLoggedIn()">
        <a routerLink="/account" class="nav-account">
          <div class="nav-avatar">{{ auth.user()?.name?.charAt(0) | uppercase }}</div>
        </a>
      </ng-container>

      <!-- WhatsApp -->
      <a href="https://wa.me/919876543210" target="_blank" class="nav-wa">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
    </div>

    <button class="nav-toggle" (click)="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile Menu -->
<div class="mob-menu" [class.open]="menuOpen">
  <a routerLink="/" (click)="closeMenu()"><i class="fas fa-home"></i> Home</a>
  <a routerLink="/products" (click)="closeMenu()"><i class="fas fa-th-large"></i> Products</a>
  <a routerLink="/cart" (click)="closeMenu()">
    <i class="fas fa-shopping-cart"></i> Cart
    <span class="mob-cart-badge" *ngIf="cart.count() > 0">{{ cart.count() }}</span>
  </a>
  <a *ngIf="!auth.isLoggedIn()" routerLink="/login" (click)="closeMenu()"><i class="fas fa-sign-in-alt"></i> Sign In</a>
  <a *ngIf="auth.isLoggedIn()" routerLink="/account" (click)="closeMenu()"><i class="fas fa-user"></i> My Account</a>
  <a *ngIf="auth.isAdmin()" routerLink="/admin" (click)="closeMenu()"><i class="fas fa-gauge"></i> Admin</a>
  <a href="https://wa.me/919876543210" target="_blank" class="mob-wa" (click)="closeMenu()">
    <i class="fab fa-whatsapp"></i> WhatsApp Us
  </a>
</div>
